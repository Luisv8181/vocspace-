name: Validate VocSpace domain model

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax, domain schemas, source records, and matching
        run: npm run validate
